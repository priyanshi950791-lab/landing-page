<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My E-commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PUT YOUR SECRET KEY HERE -->

    <header>
        <nav class="navbar">
            <h1>My Store</h1>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="products">

        <div class="product-card">
            <img src="photo-1496181133206-80ce9b88a853.jpeg" alt="Laptop">
            <h3>Laptop</h3>
            <p class="price">₹50,000</p>
            <button class="buy-btn">Buy</button>
        </div>

        <div class="product-card">
            <img src="photo-1505740420928-5e560c06d30e.jpeg" alt="Headphones">
            <h3>Headphones</h3>
            <p class="price">₹2,500</p>
            <button class="buy-btn">Buy</button>
        </div>

        <div class="product-card">
            <img src="photo-1511707171634-5f897ff02aa9.jpeg" alt="Phone">
            <h3>Smartphone</h3>
            <p class="price">₹25,000</p>
            <button class="buy-btn">Buy</button>
        </div>

        <div class="product-card">
            <img src="photo-1521572163474-6864f9cf17ab.jpeg" alt="T-Shirt">
            <h3>T-Shirt</h3>
            <p class="price">₹999</p>
            <button class="buy-btn">Buy</button>
        </div>

        <div class="product-card">
            <img src="photo-1523275335684-37898b6baf30.jpeg" alt="Watch">
            <h3>Watch</h3>
            <p class="price">₹3,000</p>
            <button class="buy-btn">Buy</button>
        </div>

        <div class="product-card">
            <img src="photo-1542291026-7eec264c27ff.jpeg" alt="Shoes">
            <h3>Shoes</h3>
            <p class="price">₹2,000</p>
            <button class="buy-btn">Buy</button>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 My Store. All rights reserved.</p>
    </footer>

</body>
</html>
